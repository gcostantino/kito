name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src/
        continue-on-error: true
      # Tests are not enabled yet: part of the suite predates the current API.
      # - name: Run tests
      #   run: pytest tests/ -v --cov=kito --cov-report=term-missing
      - name: Tests (coming soon)
        run: echo "Tests are under development and will be enabled soon"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build documentation
        run: |
          pip install -e . -r docs/requirements.txt
          sphinx-build -W --keep-going -b html docs/source docs/_build/html
